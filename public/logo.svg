<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Approximated conic via four arc segments -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D1F"/>
      <stop offset="1" stop-color="#FF4D1F" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D1F" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g3" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FF4D1F"/>
    </linearGradient>
  </defs>

  <!-- Ink background disc (full bleed) -->
  <circle cx="32" cy="32" r="32" fill="#0A0A0A"/>

  <!-- Four colored arc segments forming the halo ring (stroke-width = ring thickness) -->
  <g fill="none" stroke-width="6" stroke-linecap="butt">
    <!-- 0°→90° (top → right): orange -->
    <path d="M 32 3 A 29 29 0 0 1 61 32" stroke="url(#g1)"/>
    <!-- 90°→180° (right → bottom): orange→purple -->
    <path d="M 61 32 A 29 29 0 0 1 32 61" stroke="url(#g2)"/>
    <!-- 180°→270° (bottom → left): purple→cyan -->
    <path d="M 32 61 A 29 29 0 0 1 3 32" stroke="url(#g3)"/>
    <!-- 270°→360° (left → top): cyan→orange -->
    <path d="M 3 32 A 29 29 0 0 1 32 3" stroke="url(#g4)"/>
  </g>

  <!-- Centered italic 'a' wordmark -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="'Instrument Serif', 'Times New Roman', serif"
    font-style="italic"
    font-size="34"
    fill="#EFEAE2"
  >a</text>
</svg>
